spring:
  application:
    name: ecommerce-admin
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO

file:
  upload:
    root-path: ${java.io.tmpdir}/ecommerce-test/upload
    limits:
      PRODUCT: 2
    allowed-extensions: [ jpg, jpeg, png, gif, webp, pdf ]

service:
  jwt:
    token-type: Bearer
    key: c0h-5G2yWGA3hfjdrTQIU_xfWa_JLRvnfzTKdbcQ4bJj3CuSHczMq-NvgfQ4cAYkdNfCWwqQy_f5BNfidSGlNw==
    access-expiration: 3600000
    refresh-expiration: 864000000
