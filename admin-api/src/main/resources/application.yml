# Spring
spring:
  application:
    name: ecommerce-admin
  # PostgreSQL Database (Docker, admin-api/user-api 공유)
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    driver-class-name: org.postgresql.Driver
    username: ecommerce
    password: ecommerce
    # PostgreSQL은 JPA lock timeout 힌트를 지원하지 않아 커넥션 단위로 락 대기 시간을 제한한다
    hikari:
      connection-init-sql: SET lock_timeout = '3s'
  # Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  # multipart
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8081

# log level
logging:
  level:
    root: INFO
    org:
      springframework:
        security: DEBUG
      hibernate:
        type:
          descriptor:
            sql: TRACE

file:
  upload:
    root-path: C:/Users/EM_NB143/personal/project/ecommerce/upload/file
    limits:
      PRODUCT: 2
    allowed-extensions: [ jpg, jpeg, png, gif, webp, pdf ]

